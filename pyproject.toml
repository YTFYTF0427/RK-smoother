[project]
name = "neuralfa"
version = "0.1.0"
description = "Neural architectures for learning multigrid components via local Fourier analysis"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.2",
    "scipy>=1.16.0",
    "torch>=2.6.0",
    "matplotlib>=3.10.8",
]

[project.urls]
Repository = "https://github.com/Tripudium/neuralfa"
Issues = "https://github.com/Tripudium/neuralfa/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuralfa"]
